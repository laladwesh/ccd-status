# CCD System Status. Deploy with:  docker compose up -d --build
#
#   gateway (nginx)  127.0.0.1:6059  -> serves client + /status.json, proxies /api to server
#   server  (API)    bridge network only
#   worker  (checks) network_mode: host (probes portals at 127.0.0.1:<port>)
#   mongo            127.0.0.1:27018 (own DB; host mongod owns 27017)
#   docker-proxy     127.0.0.1:23750 (read-only: CONTAINERS=1, everything else 0)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    container_name: ccd-status-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ccd-status-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # read-only container list/inspect: the ONLY thing enabled
      POST: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SECRETS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      SYSTEM: 0
    ports:
      - "127.0.0.1:23750:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # mounted into the proxy only, never into the app
    mem_limit: 64m
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ccd-status-worker
    restart: unless-stopped
    network_mode: host   # probes the portals on 127.0.0.1:<port>
    env_file: .env
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@127.0.0.1:27018/ccdstatus?authSource=admin
      DOCKER_PROXY_URL: http://127.0.0.1:23750
      STATUS_DIR: /data
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - status_data:/data
    depends_on:
      mongo: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    logging: *logging

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ccd-status-server
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/ccdstatus?authSource=admin
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    logging: *logging

  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    container_name: ccd-status-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:6059:80"   # host nginx proxies /ccd-status/ here
    volumes:
      - status_data:/usr/share/nginx/status:ro   # status.json written by the worker
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ccd-status/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *logging

volumes:
  mongo_data:
  status_data:
