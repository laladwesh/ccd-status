# CCD System Status. Project name: ccd-status. Deploy by hand:  docker compose up -d --build
#
#   socket-proxy  127.0.0.1:23750  read-only Docker API (CONTAINERS=1 only)
#   worker        host network     probes portals at 127.0.0.1:<port>; status logic runs in memory; writes status.json
#   server        host network     API on 127.0.0.1:6060 only (REST + SSE + admin); serves status.json if Mongo is down
#   gateway       host network     nginx on 127.0.0.1:6059 only -> client build, /status.json, proxies /api/ to 127.0.0.1:6060
#
# Database: the EXISTING host mongod, database "ccd-status" (MONGO_URI in .env). No Mongo container.
# Worker, server and gateway use host networking like the other CCD portals, because the mongod listens on the
# host loopback, which bridge containers cannot reach. Host mongod down != status page down: the worker keeps
# probing from memory, buffers results (~1 h), and writes status.json every cycle; healthchecks never depend on Mongo.

name: ccd-status

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-build-args: &build-args
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}

x-hardening: &hardening
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ccd-status-socket-proxy
    environment:
      CONTAINERS: 1   # read-only container list/inspect: the ONLY API enabled
      POST: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SECRETS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      NODES: 0
      PING: 0
      PLUGINS: 0
      SESSION: 0
      SYSTEM: 0
      VERSION: 0
    ports:
      - "127.0.0.1:23750:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # mounted into the proxy only, never into the app
    # NOT read_only: haproxy renders /usr/local/etc/haproxy/haproxy.cfg at start-up. The other hardening
    # (no-new-privileges, :ro socket, CONTAINERS=1 only, loopback-only port) still applies.
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      # Works with PING=0: it asks for /containers/json, the one endpoint the proxy allows (CONTAINERS=1),
      # so it also proves the proxy can reach the Docker socket.
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:2375/containers/json?limit=1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m

  # One-shot: makes the shared status volume writable by the worker (uid 1000) on a fresh deploy, so no manual
  # chown is ever needed. Reuses the worker image, runs as root, chowns /data and exits.
  init-perms:
    image: ccd-status-worker:${GIT_SHA:-local}
    pull_policy: never           # built by the worker service in the same `up --build`
    container_name: ccd-status-init-perms
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1000:1000 /data && chmod 755 /data"]
    volumes:
      - ccd_status_data:/data
    restart: "no"
    init: true
    healthcheck:
      disable: true              # one-shot: do not inherit the worker image's HEALTHCHECK
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging: *logging
    mem_limit: 16m

  worker:
    <<: *hardening
    build:
      context: ./worker
      additional_contexts:
        shared: ./shared
      args: *build-args
    image: ccd-status-worker:${GIT_SHA:-local}
    container_name: ccd-status-worker
    network_mode: host
    env_file: .env
    environment:
      DOCKER_PROXY_URL: http://127.0.0.1:23750
      STATUS_DIR: /data
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ccd_status_data:/data      # status.json + heartbeat (server and gateway mount it read-only)
    depends_on:
      init-perms: { condition: service_completed_successfully }
      socket-proxy: { condition: service_healthy }   # NOT on Mongo: the worker must run while the DB is down
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m

  server:
    <<: *hardening
    build:
      context: ./server
      additional_contexts:
        shared: ./shared
      args: *build-args
    image: ccd-status-server:${GIT_SHA:-local}
    container_name: ccd-status-server
    network_mode: host
    env_file: .env
    environment:
      PORT: 6060
      HOST: 127.0.0.1              # loopback only, never 0.0.0.0
      STATUS_DIR: /data
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ccd_status_data:/data:ro   # /api/status serves status.json when Mongo is unavailable
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m

  gateway:
    <<: *hardening
    build:
      context: ./client
      additional_contexts:
        deploy: ./deploy
      args:
        <<: *build-args
        BASE_PATH: /ccd-status
        GATEWAY_PORT: "6059"
    image: ccd-status-gateway:${GIT_SHA:-local}
    container_name: ccd-status-gateway
    network_mode: host         # listens on 127.0.0.1:6059 only (set in the nginx template)
    volumes:
      - ccd_status_data:/usr/share/nginx/status:ro   # status.json written by the worker
    depends_on:
      - server                 # started, not healthy: the page and status.json must keep working if the API is down
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m

volumes:
  ccd_status_data:
    name: ccd_status_data
