# Gateway: serves the built client + /ccd-status/status.json directly and proxies /ccd-status/api to the API.
# If the API container is down, the page and status.json keep working (the client falls back to status.json).

# Docker's embedded DNS. Using a variable in proxy_pass makes nginx resolve "server" per request,
# so nginx still STARTS (and serves static files) when the API container is down or restarting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /ccd-status { return 301 /ccd-status/; }

    # The host nginx uses `proxy_pass http://127.0.0.1:6059/;` which STRIPS the /ccd-status/ prefix
    # (browser: /ccd-status/api/x -> gateway: /api/x). Re-add the prefix internally so these
    # locations (and a direct hit on :6059/ccd-status/...) behave identically.
    rewrite ^/(?!ccd-status(?:/|$))(.*)$ /ccd-status/$1 last;

    # Static fallback snapshot written by the worker after every cycle.
    location = /ccd-status/status.json {
        alias /usr/share/nginx/status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Server-Sent Events: no buffering, long read timeout.
    location = /ccd-status/api/stream {
        set $api_upstream server:4000;
        rewrite ^/ccd-status/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 3s;
    }

    location /ccd-status/api/ {
        set $api_upstream server:4000;
        rewrite ^/ccd-status/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed assets: cache hard.
    location /ccd-status/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA (public page and /admin routes). index.html itself must not be cached.
    location /ccd-status/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /ccd-status/index.html;
    }
}
