# Gateway (nginxinc/nginx-unprivileged, host networking). TEMPLATE: client/Dockerfile substitutes
# __BASE_PATH__ and __GATEWAY_PORT__ at build time.
#
# The host nginx KEEPS the prefix when it proxies here:
#     location /ccd-status/ { proxy_pass http://127.0.0.1:6059/ccd-status/; ... }
# so every request arrives as __BASE_PATH__/..., which is also what the IITG proxy path looks like.
#
# Serves the built client, __BASE_PATH__/status.json (written by the worker, so the page still renders the
# last known state when the API is down) and proxies __BASE_PATH__/api/* (incl. SSE) to the API on 127.0.0.1:4000.
# The API upstream is a literal address, so nginx starts and serves static files even if the API is down.

server {
    listen 127.0.0.1:__GATEWAY_PORT__ default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = __BASE_PATH__ { return 301 __BASE_PATH__/; }
    location = / { return 302 __BASE_PATH__/; }

    # Static fallback snapshot written by the worker after every cycle.
    location = __BASE_PATH__/status.json {
        alias /usr/share/nginx/status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Server-Sent Events: no buffering, long read timeout.
    location = __BASE_PATH__/api/stream {
        rewrite ^__BASE_PATH__/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 3s;
    }

    location __BASE_PATH__/api/ {
        rewrite ^__BASE_PATH__/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed assets: cache hard.
    location __BASE_PATH__/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA (public page and /admin routes). index.html itself must not be cached.
    location __BASE_PATH__/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ __BASE_PATH__/index.html;
    }
}
