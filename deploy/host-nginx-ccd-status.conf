# PROVISIONAL. Not yet verified against the real host nginx config (the `nginx -T` output was not provided).
#
# Add this `location` block inside the EXISTING `server { listen 80; ... }` block that serves
# 172.17.1.18 (the same server block where the other portals' locations live). Do not create a
# new server block on port 80 for it. Then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# The path is preserved (no URI on proxy_pass), so https://iitg.ac.in/ccd-status/ ->
# http://172.17.1.18/ccd-status/ -> 127.0.0.1:6059/ccd-status/ all work with the same build.

location /ccd-status/ {
    proxy_pass http://127.0.0.1:6059;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Keep the scheme the IITG proxy used (https) if it sends one, else this server's.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;

    # Server-Sent Events (/ccd-status/api/stream) must not be buffered.
    proxy_buffering off;
}

location = /ccd-status {
    return 301 /ccd-status/;
}
