# Host nginx block for CCD System Status (server 172.17.1.148).
#
# WHERE: /etc/nginx/sites-enabled/default, inside the FIRST server { } block (server_name 172.17.1.148),
# just BEFORE that block's closing brace. Do NOT touch the second, duplicate server block.
# Exact manual apply / rollback steps are in README.md ("Apply the nginx block").
#
# The /ccd-status prefix is KEPT on the way to the gateway (the trailing /ccd-status/ in proxy_pass), so the
# gateway sees /ccd-status/... exactly like a request arriving via the IITG proxy
# (https://iitg.ac.in/ccd-status/ -> http://172.17.1.148/ccd-status/).

    location = /ccd-status { return 301 /ccd-status/; }

    location /ccd-status/ {
        proxy_pass http://127.0.0.1:6059/ccd-status/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /ccd-status;

        # Server-Sent Events (/ccd-status/api/stream) must not be buffered or cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }
